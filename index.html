<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>AI Mental Health Journal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">
  <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
</head>
<body>

<h1>My AI Mental Health Journal</h1>
<p><em>Disclaimer: This is a demo tool and not a substitute for professional mental health advice. Data is stored locally in your browser.</em></p>

<section id="entry-section">
  <h2>New Entry</h2>
  <p>How are you feeling today? Write down your thoughts or describe your day.</p>
  <label class="mdc-text-field mdc-text-field--filled mdc-text-field--textarea mdc-text-field--no-label">
    <span class="mdc-text-field__ripple"></span>
    <span class="mdc-text-field__resizer">
      <textarea id="input" class="mdc-text-field__input" rows="8" cols="40" aria-label="Journal Entry Input"></textarea>
    </span>
    <span class="mdc-line-ripple"></span>
  </label><br/>
  <button id="submit" class="mdc-button mdc-button--raised">
    <span class="mdc-button__label">SAVE ENTRY & ANALYZE</span>
  </button>
  <p id="analysis-output" class="status-text"></p>
</section>

<section id="history-section">
    <h2>My Journal History</h2>
    <div id="journal-history">
        <p>Loading history...</p>
    </div>
</section>

  <script type="module" src="./script.js"></script>

</body>
</html>
